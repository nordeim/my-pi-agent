<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2025 Annual Strategy Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'MiSans';
            src: local('MiSans'), url('fonts/MiSans-Regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        body {
            font-family: 'Roboto', 'MiSans', 'Noto Sans SC', sans-serif;
            margin: 0;
            background: #f4f4f4;
        }
        .ppt-slide {
            width: 1280px;
            height: 720px;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="ppt-slide bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1920&q=80');">
        <!-- Dark overlay -->
        <div class="absolute inset-0 bg-gradient-to-r from-[#0A2540]/95 via-[#0A2540]/85 to-[#0A2540]/40"></div>
        
        <!-- Content -->
        <div class="relative z-10 h-full flex flex-col justify-between p-12">
            <!-- Top -->
            <div class="flex justify-between items-start">
                <p class="text-white/60 text-[11px] tracking-[0.2em] font-medium">CONFIDENTIAL & PROPRIETARY</p>
                <div class="border border-white/30 rounded px-4 py-2 text-white/80 text-sm tracking-widest">LOGO</div>
            </div>
            
            <!-- Middle -->
            <div class="max-w-4xl">
                <span class="inline-block bg-[#FF5722]/20 text-[#FF5722] text-sm font-semibold tracking-[3px] px-4 py-2 rounded">2025 ANNUAL STRATEGY REVIEW</span>
                <h1 class="text-white text-[54px] font-black leading-tight mt-6">Building on Momentum</h1>
                <div class="w-24 h-1.5 bg-[#FF5722] mt-6"></div>
                <p class="text-white/80 text-lg mt-6 max-w-2xl leading-relaxed">A comprehensive review of 2024 achievements and our strategic roadmap for sustained growth in 2025.</p>
            </div>
            
            <!-- Bottom info card -->
            <div class="grid grid-cols-4 gap-6 max-w-3xl bg-white/10 backdrop-blur-md rounded-xl p-6 border border-white/20">
                <div>
                    <p class="text-white/50 text-xs uppercase tracking-wider">Prepared by</p>
                    <p class="text-white text-lg font-bold mt-1">Strategy & Operations</p>
                </div>
                <div>
                    <p class="text-white/50 text-xs uppercase tracking-wider">Date</p>
                    <p class="text-white text-lg font-bold mt-1">January 2025</p>
                </div>
                <div>
                    <p class="text-white/50 text-xs uppercase tracking-wider">Classification</p>
                    <p class="text-white text-lg font-bold mt-1">Internal Use Only</p>
                </div>
                <div>
                    <p class="text-white/50 text-xs uppercase tracking-wider">Version</p>
                    <p class="text-white text-lg font-bold mt-1">v1.0</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
