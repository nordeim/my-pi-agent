# Squid — agent sandbox egress allowlist proxy (CONTAINER variant)
# Bound inside the isolated agent-internal network only.
# The allowlist is bind-mounted read-only from the skill bundle at run time:
#   files/squid/allowlist.txt -> /etc/squid/allowlist.txt
# Edit the HOST-SIDE file, then `scripts/30-gateway.sh restart`.

http_port 3128

# --- Allowlist ---------------------------------------------------------------
# Domain allowlist shared by every workspace. One file = the whole egress
# policy. Domains are matched on CONNECT (HTTPS) and request (HTTP) targets;
# Squid itself performs DNS resolution, so workspaces never need external DNS.
acl whitelist dstdomain "/etc/squid/allowlist.txt"

# Restrict ports: only standard web ports may be proxied.
acl web_ports port 80 443
http_access deny !web_ports

http_access allow whitelist
http_access deny all

# --- Hygiene -----------------------------------------------------------------
# Don't leak workspace identities/addresses upstream.
forwarded_for off
via off
request_header_access Via deny all
request_header_access X-Forwarded-For deny all

# No on-disk cache: the gateway stays stateless and restartable at any time.
cache deny all

# Quiet, predictable logs (one line per request, includes deny reasons).
# The stdio module takes a FILE PATH — stdio:/dev/stderr is the container-
# correct sink (audit M-7: "stdio:stderr" opened a file named "stderr"
# instead, so access lines never reached `podman logs`/journald).
access_log stdio:/dev/stderr
cache_log stdio:/dev/stderr
cache_store_log none
pid_filename /dev/null
