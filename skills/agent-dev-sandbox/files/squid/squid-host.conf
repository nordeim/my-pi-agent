# Squid — agent sandbox egress allowlist proxy (HOST variant, Tier 2)
# Installed to /etc/squid/squid.conf by scripts/10-host-bootstrap.sh --tier2.
# Serves the KVM micro-VM tier: QEMU user-mode networking maps the host to
# 10.0.2.2 inside the VM, so VMs point http(s)_proxy at http://10.0.2.2:3128.
# Loopback-only bind: nothing outside this host (or its own VMs) can use it.
#
# The allowlist file is the SAME file the container gateway uses
# (files/squid/allowlist.txt); keep both in sync via
# `scripts/30-gateway.sh allow <domain>` which updates both and restarts both.

http_port 127.0.0.1:3128

acl whitelist dstdomain "/etc/squid/allowlist.txt"

acl web_ports port 80 443
http_access deny !web_ports

http_access allow whitelist
http_access deny all

forwarded_for off
via off
request_header_access Via deny all
request_header_access X-Forwarded-For deny all

cache deny all

access_log stdio:/var/log/squid/access.log
cache_store_log none
